<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>headless-bot</title>
    <script src="https://cdn.jsdelivr.net/npm/@videosdk.live/js-sdk@0.9.0/videosdk.js"></script>
  </head>
  <body>
    <div id="status">booting...</div>
    <script>
      const log = (m) => {
        document.getElementById("status").textContent = m;
        console.log("[bot]", m);
      };

      const qs = new URLSearchParams(location.search);
      const meetingId = qs.get("meetingId");
      const token     = qs.get("token");
      const name      = qs.get("name") || "headless-bot";
      const mic       = qs.get("mic") === "1";
      const cam       = qs.get("cam") === "1";

      if (!meetingId || !token) {
        log("missing meetingId/token");
        throw new Error("missing meetingId/token");
      }

      if (!window.VideoSDK) {
        log("VideoSDK script failed to load");
        throw new Error("VideoSDK missing");
      }

      window.VideoSDK.config(token);
      const meeting = window.VideoSDK.initMeeting({
        meetingId,
        name,
        micEnabled: mic,
        webcamEnabled: cam,
        participantId: "bot-" + Date.now(),
      });

      meeting.on("meeting-joined",     () => log("joined " + meetingId));
      meeting.on("meeting-left",       () => log("left"));
      meeting.on("participant-joined", (p) => log("peer joined: " + p.displayName));
      meeting.on("participant-left",   (p) => log("peer left: "   + p.displayName));
      meeting.on("error",              (e) => log("error: " + JSON.stringify(e)));

      meeting.join();
      window.__meeting = meeting;
    </script>
  </body>
</html>
